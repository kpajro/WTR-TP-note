<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Suivi de commande</title>
</head>
<body>
  <h1>Suivi de la commande <span id="id"></span></h1>
  <p>Statut : <strong id="status"></strong></p>
  <ul id="history"></ul>
  <a href="/">Retour à la boutique</a>

  <script>
    const labels = { preparing: "En préparation", shipped: "Expédiée", delivered: "Livrée", cancelled: "Annulée" };
    const id = new URLSearchParams(location.search).get("id");
    document.getElementById("id").textContent = id;

    function show(order) {
      document.getElementById("status").textContent = labels[order.status];
      const li = document.createElement("li");
      li.textContent = new Date().toLocaleTimeString() + " : " + labels[order.status];
      document.getElementById("history").appendChild(li);
    }

    async function init() {
      const res = await fetch("/orders/" + id);
      if (!res.ok) {
        document.getElementById("status").textContent = "Commande introuvable";
        return;
      }
      show(await res.json());
      const events = new EventSource("/orders/" + id + "/events");
      events.addEventListener("order-status", (e) => show(JSON.parse(e.data)));
      events.addEventListener("order-cancelled", (e) => show(JSON.parse(e.data)));
    }

    init();
  </script>
</body>
</html>
